name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, às 3h17 no horário de Brasília
  workflow_dispatch: # permite rodar manualmente na aba Actions

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Gerar cartão de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: 'username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_rank=true&locale=pt-br&hide_border=true&bg_color=15233F&title_color=F4BC5A&text_color=FBF3E4&icon_color=E9A53A'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar cartão de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: 'username=${{ github.repository_owner }}&layout=compact&langs_count=6&custom_title=Linguagens&locale=pt-br&hide_border=true&bg_color=15233F&title_color=F4BC5A&text_color=FBF3E4'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar cartões no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Atualiza cartões do perfil" || exit 0
          git push
